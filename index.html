<head>
<meta charset="utf-8">
<!-- Insomnia web shell (replaces Godot's default; export option html/custom_html_shell). Phone-first:
     dark loading screen, no zoom/scroll/selection, a "turn your phone sideways" overlay in portrait, fullscreen on
     the first tap (Android), the PWA hooks, and the Android "Get the app" banner. Godot talks to this page only
     through window.__ins (see scripts/platform.gd). -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05060c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Insomnia">
<meta name="format-detection" content="telephone=no">
<title>Insomnia</title>
<style>
html, body {
	margin: 0; padding: 0; border: 0; width: 100%; height: 100%;
	background: #05060c; color: #f4f1ea;
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none; user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: Georgia, 'Times New Roman', serif;
}
#canvas {
	display: block; margin: 0; padding: 0; border: 0;
	background: #05060c;
	touch-action: none; -webkit-user-select: none; user-select: none; outline: none;
}
#canvas:focus { outline: none; }

/* ---- loading screen ---- */
#status {
	position: fixed; inset: 0; z-index: 10;
	background: radial-gradient(ellipse at 50% 42%, #0c0e1c 0%, #05060c 70%);
	display: flex; flex-direction: column; align-items: center; justify-content: center;
	visibility: hidden; transition: opacity .35s ease;
}
#status.fade { opacity: 0; }
#moon { width: min(26vmin, 150px); height: auto; filter: drop-shadow(0 0 22px rgba(233,227,255,.28)); animation: breathe 3.6s ease-in-out infinite; }
#wordmark { margin-top: 2.2vmin; font-size: clamp(22px, 6.4vmin, 44px); letter-spacing: .32em; padding-left: .32em; color: #e8c872; }
#tag { margin-top: 1vmin; font-size: clamp(12px, 2.6vmin, 16px); color: #8c87a6; letter-spacing: .08em; font-style: italic; }
#bar { margin-top: 5vmin; width: min(52vw, 340px); height: 4px; border-radius: 2px; background: rgba(232,200,114,.16); overflow: hidden; }
#bar > i { display: block; height: 100%; width: 0%; background: #e8c872; border-radius: 2px; transition: width .2s linear; }
#bar.busy > i { width: 35%; animation: slide 1.2s ease-in-out infinite; }
#notice {
	display: none; margin: 0 24px; max-width: 520px; padding: 16px 18px; text-align: center; line-height: 1.4;
	background: #1a1226; border: 1px solid #5b3a66; border-radius: 10px; color: #e6e1f2;
	font-family: system-ui, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 16px;
}
#notice b { color: #e8c872; }
@keyframes breathe { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
@keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

/* ---- "turn your phone sideways" ---- */
#rotate {
	position: fixed; inset: 0; z-index: 1000; display: none;
	background: #05060c; flex-direction: column; align-items: center; justify-content: center;
	text-align: center; touch-action: none;
}
#rotate.on { display: flex; }
#phone-wrap { width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
#phone {
	position: relative; width: 46px; height: 84px; box-sizing: border-box;
	border: 3px solid #e8c872; border-radius: 9px; background: #0c0e1c;
	box-shadow: 0 0 18px rgba(232,200,114,.22);
	animation: turn 3.2s ease-in-out infinite;
}
#phone::before { /* the screen's moon */
	content: ''; position: absolute; left: 11px; top: 14px; width: 16px; height: 16px; border-radius: 50%;
	background: #e9e3ff; box-shadow: 5px -3px 0 0 #0c0e1c inset;
}
#phone::after { /* the speaker slot */
	content: ''; position: absolute; left: 50%; top: 5px; width: 12px; height: 2px; margin-left: -6px; border-radius: 1px; background: #e8c872; opacity: .7;
}
@keyframes turn { 0%,18% { transform: rotate(0deg); } 52%,82% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
#rotate h1 { margin: 22px 20px 6px; font-weight: normal; font-size: 26px; letter-spacing: .04em; color: #e8c872; }
#rotate p { margin: 0 24px; font-size: 16px; color: #8c87a6; font-style: italic; }
#rotate small { margin-top: 18px; font: 14px system-ui, Roboto, Arial, sans-serif; color: #6f6b87; }

/* ---- Android "Get the app" banner ---- */
#appbar {
	position: fixed; z-index: 500; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom));
	display: none; align-items: center; gap: 4px; box-sizing: border-box;
	width: min(420px, calc(100vw - 16px)); max-width: calc(100vw - 16px);
	padding: 4px 4px 4px 12px; border-radius: 12px;
	background: rgba(14,12,28,.92); border: 1px solid rgba(232,200,114,.45);
	font: 14px/1.25 system-ui, Roboto, Arial, sans-serif; color: #f4f1ea;
	touch-action: manipulation;
}
#appbar.on { display: flex; }
#appbar span { flex: 1 1 auto; min-width: 0; }
#appbar button {
	flex: none; min-width: 48px; min-height: 48px; border: 0; border-radius: 10px; cursor: pointer;
	font: inherit; touch-action: manipulation;
}
#app-go { padding: 0 14px; background: #e8c872; color: #1a1226; font-weight: 600; }
#app-x { background: transparent; color: #cfc8e6; font-size: 26px; line-height: 1; }
@media (max-height: 420px) { #appbar { font-size: 13px; width: min(380px, calc(100vw - 16px)); } }
</style>

	['resize', 'orientationchange'].forEach((t) => window.addEventListener(t, () => { updatePortrait(); setTimeout(updatePortrait, 250); }));
	if (screen.orientation && screen.orientation.addEventListener) { screen.orientation.addEventListener('change', () => setTimeout(updatePortrait, 100)); }

	// ================================================================== "Get the app" banner (Android web only)
	let installEvt = null;
	let bannerWanted = false;
	const bar = $('appbar');
	function dismissedUntil() { return Number(store.get('insomnia.appBannerUntil') || 0); }
	function renderBanner() {
		const ok = isAndroid && touchDevice && bannerWanted && !portrait && !standalone() && Date.now() >= dismissedUntil()
			&& store.get('insomnia.appInstalled') !== '1';
		bar.classList.toggle('on', ok);
		if (!ok) { return; }
		const go = $('app-go');
		if (APP_URL) {
			$('app-text').textContent = APP_TEXT;
			go.textContent = APP_LABEL;
			go.style.display = '';
		} else if (installEvt) {
			$('app-text').textContent = APP_TEXT;
			go.textContent = T('install', 'Install');
			go.style.display = '';
		} else {
			$('app-text').textContent = T('app_menu', 'Play as an app: browser menu (three dots), then Add to Home screen.');
			go.style.display = 'none';
		}
	}
	$('app-go').addEventListener('click', async () => {
		if (APP_URL) {
			window.open(APP_URL, '_blank', 'noopener');
			return;
		}
		if (!installEvt) { return; }
		const ev = installEvt;
		installEvt = null;
		try {
			ev.prompt();
			const res = await ev.userChoice;
			if (res && res.outcome === 'accepted') { store.set('insomnia.appInstalled', '1'); }
		} catch (e) { /* prompt refused */ }
		renderBanner();
	});
	$('app-x').addEventListener('click', () => {
		store.set('insomnia.appBannerUntil', String(Date.now() + APP_HIDE_DAYS * 86400000));
		renderBanner();
	});
	window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; renderBanner(); });
	window.addEventListener('appinstalled', () => { store.set('insomnia.appInstalled', '1'); installEvt = null; renderBanner(); });

	// ================================================================== the bridge Godot uses
	const api = window.__ins = {
		touchDevice, isAndroid, isIOS,
		get portrait() { return portrait; },
		onPortrait: null,
		fsSupported: () => fsSupported() && !isIOS,
		isFs: () => !!fsEl() || standalone(),
		standalone,
		setFs(on) {
			store.set('insomnia.fs', on ? '1' : '0');
			if (on) { fsTries = 0; return enterFs(); }
			exitFs();
			return false;
		},
		fsPref: () => store.get('insomnia.fs') !== '0',
		showBanner(on) { bannerWanted = !!on; renderBanner(); },
	};
	updatePortrait();

	// ================================================================== loading screen + start
	const status = $('status');
	const bar_ = $('bar');
	const notice = $('notice');
	function showNotice(html) {
		status.style.visibility = 'visible';
		['moon', 'tag'].forEach((i) => { $(i).style.display = 'none'; });
		bar_.style.display = 'none';
		notice.style.display = 'block';
		notice.innerHTML = html;
	}
	function fail(err) {
		console.error(err);
		const msg = err instanceof Error ? err.message : String(err || 'An unknown error occurred.');
		const esc = msg.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
		showNotice('<b>' + T('err_start', 'Insomnia could not start.') + '</b><br>' + esc + '<br><br>' + T('err_reload', 'Reloading the page often helps.'));
	}
	function hasWebGL2() {
		try { return !!document.createElement('canvas').getContext('webgl2'); } catch (e) { return false; }
	}

	// A new deploy must reach players: the service worker caches the game, and a new worker waits for every tab to
	// close. At page load, apply a waiting worker (one reload, once per session) and ask for an update check; if a new
	// worker finishes installing while we are still on the loading screen, apply it then. Never mid-night.
	function updateServiceWorker() {
		if (!('serviceWorker' in navigator)) { return; }
		navigator.serviceWorker.getRegistration().then((reg) => {
			if (!reg) { return; }
			const apply = (w) => {
				if (!navigator.serviceWorker.controller || sessionStorage.getItem('insomnia.swApplied')) { return; }
				try { sessionStorage.setItem('insomnia.swApplied', '1'); } catch (e) { /* ignore */ }
				w.postMessage('update');
			};
			if (reg.waiting) { apply(reg.waiting); return; }
			reg.addEventListener('updatefound', () => {
				const w = reg.installing;
				if (w) { w.addEventListener('statechange', () => { if (w.state === 'installed' && !gameStarted) { apply(w); } }); }
			});
			reg.update().catch(() => {});
		}).catch(() => {});
	}

	status.style.visibility = 'visible';
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (!hasWebGL2() || missing.some((m) => /webgl/i.test(m))) {
		showNotice('<b>' + T('err_browser', 'This browser cannot run Insomnia.') + '</b><br>'
			+ T('err_webgl', 'It needs WebGL 2, which is switched off or missing here. Try the latest Chrome, Edge, Firefox or Safari, and make sure hardware acceleration is on.'));
	} else if (missing.length !== 0) {
		showNotice('<b>' + T('err_browser', 'This browser cannot run Insomnia.') + '</b><br>' + T('err_missing', 'Missing:') + ' ' + missing.join(', '));
	} else {
		updateServiceWorker();
		engine.startGame({
			onProgress(current, total) {
				const f = $('bar').firstElementChild;
				if (current > 0 && total > 0) {
					bar_.classList.remove('busy');
					f.style.width = Math.min(100, (100 * current / total)).toFixed(1) + '%';
				} else {
					bar_.classList.add('busy');
					f.style.width = '';
				}
			},
		}).then(() => {
			gameStarted = true;
			status.classList.add('fade');
			setTimeout(() => status.remove(), 450);
			canvas.focus();
		}, fail);
	}
}());
</script>
